name: Build and Sign

on:
  push:
    branches: [main]

jobs:
  sign:
    runs-on: windows-latest
    permissions:
      id-token: write    # required for OIDC
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: https://neu.codesigning.azure.net/        # your region — NEU
          trusted-signing-account-name: backnot               # your account name
          certificate-profile-name: profile                   # your profile name
          files-folder: ${{ github.workspace }}
          files-folder-filter: exe                            # signing ps1 like your old workflow
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify
        run: Get-AuthenticodeSignature "unsigned.exe"
        shell: powershell

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-test
          path: unsigned.exe
